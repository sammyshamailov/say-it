[build]
  publish = "."

# Word recordings (Wiktionary, CC BY-SA) are served through this site so the app can keep them offline.
[[redirects]]
  from = "/media/*"
  to = "https://api.dictionaryapi.dev/media/pronunciations/en/:splat"
  status = 200
  force = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
